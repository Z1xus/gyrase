[package]
name = "gyrase"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Desktop app to turn whole-genome DNA files into VCF and raw genotype files"
readme = "README.md"
keywords = ["genomics", "bioinformatics", "dna", "vcf", "gui"]
categories = ["gui", "science::bioinformatics::genomics"]
build = "build.rs"

[[bin]]
name = "gyrase"
path = "src/main.rs"

[features]
gpu = ["gyrase-jobs/gpu"]

[dependencies]
gyrase-extract.workspace = true
gyrase-jobs.workspace = true
opener = { version = "0.8.4", default-features = false }
rfd = "0.18.0"
slint.workspace = true

[build-dependencies]
slint-build = "1.18.1"

[target.'cfg(windows)'.build-dependencies]
winresource = { version = "0.1.34", default-features = false }

[lints]
workspace = true
