[package]
name = "gyrase-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line tool (gyr) to turn DNA files into VCF and raw genotype files"
readme = "README.md"
keywords = ["genomics", "bioinformatics", "cli", "samtools", "bcftools"]
categories = ["command-line-utilities", "science::bioinformatics::genomics"]

[[bin]]
name = "gyr"
path = "src/main.rs"

[features]
gpu = ["gyrase-jobs/gpu"]

[dependencies]
gyrase-extract.workspace = true
gyrase-genome.workspace = true
gyrase-index.workspace = true
gyrase-io.workspace = true
gyrase-jobs.workspace = true
gyrase-reads.workspace = true
gyrase-variants.workspace = true
ctrlc.workspace = true
lexopt.workspace = true

[lints]
workspace = true
