[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
authors = ["Z1xus"]
license = "GPL-3.0-or-later"
repository = "https://github.com/Z1xus/gyrase"

[workspace.dependencies]
gyrase-genome = { path = "crates/genome" }
gyrase-io = { path = "crates/io" }
gyrase-jobs = { path = "crates/jobs" }
crossbeam-channel = "0.5.17"
flate2 = { version = "1.1.11", default-features = false, features = ["zlib-rs"] }
libdeflater = "1.26.1"
memchr = "2.8.3"
md-5 = "0.11.0"
rayon = "1.12.0"
sysinfo = { version = "0.40.4", default-features = false, features = ["system"] }
thiserror = "2.0.21"

[workspace.lints.rust]
unsafe_code = "deny"
unused_qualifications = "deny"
missing_debug_implementations = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"
print_stdout = "deny"
print_stderr = "deny"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
strip = "symbols"

[profile.bench]
inherits = "release"
strip = "none"
debug = "line-tables-only"
