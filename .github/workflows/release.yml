name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-24.04, name: linux-x86_64 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm, name: linux-arm64 }
          - { target: x86_64-pc-windows-msvc, os: windows-2025, name: windows-x86_64 }
          - { target: aarch64-pc-windows-msvc, os: windows-11-arm, name: windows-arm64 }
          - { target: aarch64-apple-darwin, os: macos-15, name: macos-arm64 }
          - { target: x86_64-apple-darwin, os: macos-15, name: macos-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: check version
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "gyrase-cli") | .version')
          test "v$version" = "$GITHUB_REF_NAME"
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfontconfig-dev libxkbcommon-dev
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --workspace --release --locked --target ${{ matrix.target }}
      - name: package
        shell: bash
        run: |
          name=gyrase-${{ matrix.name }}
          mkdir "$name"
          exe=$([ "$RUNNER_OS" = Windows ] && echo .exe || true)
          cp target/${{ matrix.target }}/release/gyr$exe target/${{ matrix.target }}/release/gyrase$exe LICENSE "$name"
          if [ "$RUNNER_OS" = Windows ]; then 7z a "$name.zip" "$name"; else tar -czf "$name.tar.gz" "$name"; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: |
            gyrase-*.tar.gz
            gyrase-*.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && LC_ALL=C sha256sum gyrase-* > SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: scan
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        shell: bash
        run: |
          printf '\n### Virus scans\n\n' > scans.md
          badge=https://www.shieldcn.dev/badge
          query="variant=secondary&amp;size=sm&amp;logo=virustotal&amp;mode"
          while read -r name label; do
            file=$(echo dist/gyrase-"$name".*)
            sum=$(sha256sum "$file" | cut -d' ' -f1)
            # files over 32 MB need a one-time upload url
            url=$(curl -fsS -H "x-apikey: $VT_API_KEY" https://www.virustotal.com/api/v3/files/upload_url | jq -r .data)
            sleep 16
            curl -fsS -H "x-apikey: $VT_API_KEY" -F "file=@$file" "$url" > /dev/null
            printf '<a href="https://www.virustotal.com/gui/file/%s"><picture><source media="(prefers-color-scheme: dark)" srcset="%s/%s.svg?%s=dark"><img alt="%s" src="%s/%s.svg?%s=light"></picture></a> ' \
              "$sum" "$badge" "$label" "$query" "$name" "$badge" "$label" "$query" >> scans.md
            # the free api allows 4 requests per minute
            sleep 16
          done <<'EOF'
          windows-x86_64 Windows
          windows-arm64 Windows%20%28ARM%29
          macos-arm64 macOS%20%28Apple%20Silicon%29
          macos-x86_64 macOS%20%28Intel%29
          linux-x86_64 Linux
          linux-arm64 Linux%20%28ARM%29
          EOF
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v version="$version" '/^## /{found = $2 == version; next} found' CHANGELOG.md > notes.md
          grep -q . notes.md
          cat scans.md >> notes.md
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md dist/*
          gh release edit "$GITHUB_REF_NAME" --draft=false
